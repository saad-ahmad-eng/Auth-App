// authlock-client — the Swing RMI client (UIUX.md, Architecture.md §2.1).
// Depends on authlock-common for the shared remote interface and DTOs.

apply plugin: 'application'

application {
    mainClass = 'com.authlock.client.ClientMain'
}

// See authlock-server/build.gradle — must agree on the same working
// directory so both processes see the same authlock-shared.key.
tasks.named('run') {
    workingDir = rootProject.projectDir
}

dependencies {
    implementation project(':authlock-common')
}

// Phase 12 deliverable (Implementation.md, `auth` §10): "Deployable .jar
// files for both client and server" — see authlock-server/build.gradle's
// matching fatJar task for the full rationale.
// Run with: java -jar authlock-client-all.jar [host]
tasks.register('fatJar', Jar) {
    group = 'distribution'
    description = 'Builds a single self-contained runnable jar (Phase 12 deliverable).'
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.output)
    dependsOn(configurations.runtimeClasspath)
    from({
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    })
}
