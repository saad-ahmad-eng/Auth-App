# AuthLock seed user list — Implementation Phase 3 resolution of Open
# Question OQ-01 (Context.md §7): AuthLock has no self-service registration
# (PRD.md §4.1), so demo accounts are provisioned here instead.
#
# THIS IS COURSEWORK DEMO DATA, NOT A PRODUCTION CREDENTIAL STORE.
# Passwords here are plaintext only as seed input — UserStore hashes each one
# (PBKDF2WithHmacSHA256, salted) at server startup and never retains the
# plaintext afterward (Security.md §3, SEC-002). Do not add real-world
# credentials to this file.
#
# format: username=password
#
# Deliberately no symbol characters (was AliceP@ss1/BobP@ss1) — '@' sits on a
# different key/shift-combination depending on physical keyboard layout
# (US vs UK vs international), so a correctly-typed password on one layout
# can silently produce a different character on another. Letters+digits only
# avoids that class of "works via curl, fails in a real browser on a
# different keyboard layout" bug.
alice=Alice2026Pass
bob=Bob2026Pass
#
# Phase 13 follow-up (admin panel): a NEW dedicated account, rather than
# promoting alice or bob — keeps both of those as plain STANDARD demo
# users exactly as every existing test/doc already assumes, instead of
# retroactively changing an established identity's role. UserStore.java
# grants ADMIN to whichever seed username equals "admin" specifically.
admin=Admin2026Pass
