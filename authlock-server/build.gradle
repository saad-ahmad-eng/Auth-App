// authlock-server — the RMI server: registry bootstrap, VaultService implementation,
// and the internal Authentication / Session / Vault / Lock / Encryption / Audit modules
// (Architecture.md §2, Backend.md §1). Depends on authlock-common for the shared
// remote interface and DTOs.

apply plugin: 'application'

application {
    mainClass = 'com.authlock.server.ServerMain'
}

// Run from the repo root, not this subproject's directory (Gradle's default),
// so relative paths (vault-storage/, authlock-shared.key) land in one place
// shared with authlock-client's run task — both must agree on the same
// files for the demo to work. See Context.md Phase 4's "Known Issues".
tasks.named('run') {
    workingDir = rootProject.projectDir
}

dependencies {
    implementation project(':authlock-common')
}
