// authlock-server — the RMI server: registry bootstrap, VaultService implementation,
// and the internal Authentication / Session / Vault / Lock / Encryption / Audit modules
// (Architecture.md §2, Backend.md §1). Depends on authlock-common for the shared
// remote interface and DTOs.

apply plugin: 'application'

application {
    mainClass = 'com.authlock.server.ServerMain'
}

// Run from the repo root, not this subproject's directory (Gradle's default),
// so relative paths (vault-storage/, authlock-shared.key) land in one place
// shared with authlock-client's run task — both must agree on the same
// files for the demo to work. See Context.md Phase 4's "Known Issues".
tasks.named('run') {
    workingDir = rootProject.projectDir
}

dependencies {
    implementation project(':authlock-common')
}

// Phase 12 deliverable (Implementation.md, `auth` §10): "Deployable .jar
// files for both client and server". No external runtime dependency exists
// beyond authlock-common (JUnit is test-only, RMI/Swing/JCE are JDK-bundled)
// — a hand-rolled fat jar via Gradle's built-in Jar task covers this with
// no new plugin/network dependency, unlike a shadow/shadowJar approach.
// Run with: java -jar authlock-server-all.jar
tasks.register('fatJar', Jar) {
    group = 'distribution'
    description = 'Builds a single self-contained runnable jar (Phase 12 deliverable).'
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.output)
    dependsOn(configurations.runtimeClasspath)
    from({
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    })
}
